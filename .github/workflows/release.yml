name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.46.0'

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and validate content
        run: just test

      - name: Build Linux and Windows
        run: just build-linux build-windows

      - name: Package Linux
        run: tar -czf build/packets-please-linux-x86_64.tar.gz -C build/linux .

      - name: Package Windows
        working-directory: build/windows
        run: zip -r ../packets-please-windows-x86_64.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            build/packets-please-linux-x86_64.tar.gz
            build/packets-please-windows-x86_64.zip
